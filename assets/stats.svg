<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="500" height="210">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="100%" stop-color="#dda0dd"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="500" height="210" rx="14" fill="url(#bg)" stroke="#ffb6c1" stroke-width="2"/>

  <!-- Header -->
  <text x="25" y="40" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#333333">
    lynn-lelelele's stats
  </text>
  <line x1="25" y1="50" x2="225" y2="50" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stat boxes -->
  <!-- Row 1 -->
  <rect x="25" y="65" width="140" height="55" rx="8" fill="white" stroke="#ffb6c1" stroke-width="1"/>
  <text x="95" y="86" font-family="monospace" font-size="21" font-weight="bold" fill="#333333" text-anchor="middle">0</text>
  <text x="95" y="108" font-family="Segoe UI, sans-serif" font-size="11" fill="#888" text-anchor="middle">Total Stars</text>

  <rect x="180" y="65" width="140" height="55" rx="8" fill="white" stroke="#dda0dd" stroke-width="1"/>
  <text x="250" y="86" font-family="monospace" font-size="21" font-weight="bold" fill="#333333" text-anchor="middle">0</text>
  <text x="250" y="108" font-family="Segoe UI, sans-serif" font-size="11" fill="#888" text-anchor="middle">Commits</text>

  <rect x="335" y="65" width="140" height="55" rx="8" fill="white" stroke="#ffb6c1" stroke-width="1"/>
  <text x="405" y="86" font-family="monospace" font-size="21" font-weight="bold" fill="#333333" text-anchor="middle">1</text>
  <text x="405" y="108" font-family="Segoe UI, sans-serif" font-size="11" fill="#888" text-anchor="middle">Followers</text>

  <!-- Row 2 -->
  <rect x="25" y="130" width="140" height="55" rx="8" fill="white" stroke="#dda0dd" stroke-width="1"/>
  <text x="95" y="151" font-family="monospace" font-size="21" font-weight="bold" fill="#333333" text-anchor="middle">4</text>
  <text x="95" y="173" font-family="Segoe UI, sans-serif" font-size="11" fill="#888" text-anchor="middle">Repos</text>

  <rect x="180" y="130" width="140" height="55" rx="8" fill="white" stroke="#ffb6c1" stroke-width="1"/>
  <text x="250" y="151" font-family="monospace" font-size="21" font-weight="bold" fill="#333333" text-anchor="middle">0</text>
  <text x="250" y="173" font-family="Segoe UI, sans-serif" font-size="11" fill="#888" text-anchor="middle">Forks</text>

  <rect x="335" y="130" width="140" height="55" rx="8" fill="white" stroke="#dda0dd" stroke-width="1"/>
  <text x="405" y="151" font-family="monospace" font-size="21" font-weight="bold" fill="#333333" text-anchor="middle">0</text>
  <text x="405" y="173" font-family="Segoe UI, sans-serif" font-size="11" fill="#888" text-anchor="middle">Following</text>
</svg>