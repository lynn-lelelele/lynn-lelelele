name: snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: lynn-lelelele
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit snake SVGs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/snake.svg assets/snake-dark.svg
          git diff --staged --quiet || git commit -m "update snake [skip ci]"
          git push
